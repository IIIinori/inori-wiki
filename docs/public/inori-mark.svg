    <path d="M146 338C174 325 205 328 228 348" stroke="#6D5BD0" stroke-opacity="0.32" stroke-width="8" stroke-linecap="round"/>
    <path d="M366 304C339 291 306 294 284 315" stroke="#2563EB" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    <path d="M366 338C338 325 307 328 284 348" stroke="#2563EB" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M74 256C74 155.5 155.5 74 256 74" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8" stroke-linecap="round"/>
