<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Inori Logo Mark</title>
  <desc id="desc">A glowing pixel diamond and open book logo mark for the Inori series.</desc>
  <defs>
    <linearGradient id="bg" x1="88" y1="72" x2="424" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A3A"/>
      <stop offset="0.48" stop-color="#271A55"/>
      <stop offset="1" stop-color="#0E2447"/>
    </linearGradient>
    <linearGradient id="gem" x1="150" y1="124" x2="378" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDEBFF"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="page" x1="132" y1="244" x2="380" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="glow" x="48" y="42" width="416" height="428" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.37 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in2="BackgroundImageFix" mode="screen" result="effect"/>
      <feBlend in="SourceGraphic" in2="effect" result="shape"/>
    </filter>
    <filter id="softShadow" x="75" y="92" width="362" height="332" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#bg)"/>
  <rect x="50" y="50" width="412" height="412" rx="102" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <g opacity="0.55">
    <rect x="96" y="128" width="26" height="26" rx="6" fill="#A78BFA"/>
    <rect x="388" y="154" width="20" height="20" rx="5" fill="#5EEAD4"/>
    <rect x="362" y="352" width="28" height="28" rx="7" fill="#93C5FD"/>
