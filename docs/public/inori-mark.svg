    <path d="M256 102L372 218H140L256 102Z" fill="#FFFFFF" fill-opacity="0.18"/>
    <path d="M197 218L256 102L315 218L256 334L197 218Z" fill="#10132F" fill-opacity="0.18"/>
    <path d="M140 218H372" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"/>
    <path d="M256 102V334" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round"/>
  </g>

